<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 800" width="650" height="800" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Blue glossy sphere -->
    <radialGradient id="ball" cx="0.4" cy="0.36" r="0.68" fx="0.4" fy="0.36">
      <stop offset="0" stop-color="#e6f0ff"/>
      <stop offset="0.12" stop-color="#6aa8f5"/>
      <stop offset="0.45" stop-color="#2f7de0"/>
      <stop offset="0.8" stop-color="#1a5bb8"/>
      <stop offset="1" stop-color="#0f3f8a"/>
    </radialGradient>
    <!-- Metallic needle -->
    <linearGradient id="needle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e6e6e"/>
      <stop offset="0.25" stop-color="#c8c8c8"/>
      <stop offset="0.45" stop-color="#f2f2f2"/>
      <stop offset="0.7" stop-color="#b5b5b5"/>
      <stop offset="1" stop-color="#5a5a5a"/>
    </linearGradient>
    <!-- Hole / shadow at base -->
    <radialGradient id="hole" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="0.7" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#666"/>
    </radialGradient>
  </defs>

  <!-- Base hole -->
  <ellipse cx="310" cy="648" rx="46" ry="22" fill="url(#hole)" stroke="#999" stroke-width="1"/>

  <!-- Needle -->
  <rect x="287" y="280" width="46" height="370" fill="url(#needle)"/>
  <ellipse cx="310" cy="650" rx="23" ry="8" fill="url(#needle)"/>

  <!-- Sphere -->
  <circle cx="310" cy="185" r="116" fill="url(#ball)"/>
</svg>
